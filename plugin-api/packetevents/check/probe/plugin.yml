name: PacketProbe
version: '1'
main: foton.probe.PacketProbe
api-version: '1.21'
depend: [packetevents]
commands:
  probetp:
    description: Moves the player into another loaded world.
  probecraft:
    description: Writes down the top of the open view.
  probegui:
    description: Opens a menu of the probe's own.
  probespawn:
    description: Spawns each entity class Zelda Civ spawns, through World.spawn.
  probehands:
    description: Writes down both hands.
  probestand:
    description: Writes down the nearest armor stand's helmet.
  probevehicle:
    description: Writes down the vehicle the player rides.
  probepdc:
    description: Writes or reads persistent data on the player, entities and chunk.
  probeitems:
    description: Gives an elytra with attribute modifiers and player heads with profiles, and reads them back.
  probetile:
    description: Reads the probe's tag off the tile state at x y z.
  probefurnace:
    description: Loads sand and coal into the furnace at x y z.
  probeapispawn:
    description: Spawns a cow, then two pigs, through the plugin API.
  probegolems:
    description: probegolems refuse makes the probe veto iron golem builds.
  probeents:
    description: Counts the entities of the player's world by type.
  probebreed:
    description: Spawns two cows in love mode beside the player.
  probebanner:
    description: Walks the Banner block state pattern API on a banner placed beside the player.
