name: Build Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version change
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          current=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')

          echo "current=${current}" >> "$GITHUB_OUTPUT"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(git show "${BEFORE_SHA}:Cargo.toml" | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/')
          if [[ "${previous}" == "${current}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Static musl builds so no distribution's libc matters.
          - name: foton-linux-x86_64-musl
            os: ubuntu-latest
            artifact: foton
            target: x86_64-unknown-linux-musl
          # Native ARM runner: cross-linking musl for aarch64 from an x86
          # runner needs its own linker, a native runner needs none.
          - name: foton-linux-aarch64-musl
            os: ubuntu-24.04-arm
            artifact: foton
            target: aarch64-unknown-linux-musl
          - name: foton-windows-x86_64
            os: windows-latest
            artifact: foton.exe
            target: ""
          - name: foton-macos-aarch64
            os: macos-latest
            artifact: foton
            target: ""
          # macos-latest runners are Apple Silicon; the Intel build is a
          # cross-compile, which the bundled SDK supports without extra setup.
          - name: foton-macos-x86_64
            os: macos-latest
            artifact: foton
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - name: Add cross-compile target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add ${{ matrix.target }}
      - name: Build portable release binary
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --features stand-alone,deadlock_detection --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.target && format('target/{0}/release/{1}', matrix.target, matrix.artifact) || format('target/release/{0}', matrix.artifact) }}

  release:
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          mv artifacts/foton-linux-x86_64-musl/foton release/foton-linux-x86_64-musl
          mv artifacts/foton-linux-aarch64-musl/foton release/foton-linux-aarch64-musl
          mv artifacts/foton-windows-x86_64/foton.exe release/foton-windows-x86_64.exe
          mv artifacts/foton-macos-aarch64/foton release/foton-macos-aarch64
          mv artifacts/foton-macos-x86_64/foton release/foton-macos-x86_64

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.current }}
          name: v${{ needs.version.outputs.current }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: release/*
          generate_release_notes: true

      - name: Trigger release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.version.outputs.current }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=foton-released \
            -f "client_payload[tag]=${RELEASE_TAG}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
