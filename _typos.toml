[files]
extend-exclude = [
    "**/build_assets/**", "*.json", "CLAUDE.md",
    # The French edition of the site. `typos` has no French dictionary, and a
    # fluent French sentence is a false-positive minefield for an en-us
    # checker ("registre", "construit", "reste", ...) -- `[type.*]` overrides
    # can't fix this, because a file already claimed by a built-in extension
    # type (here `html`) never falls through to a glob-based custom type, so
    # exclusion is the only lever that reliably works.
    "site/content/fr/**",
]

[type.locale]
extend-glob = ["**/locale.rs"]
check-file = false

[default.extend-words]
# Project name: Foton (not a misspelling of "photon").
foton = "foton"
Foton = "Foton"
FOTON = "FOTON"
flate = "flate"
strat = "strat"
axe = "axe"
BlockBehaviour = "BlockBehaviour"
behaviour = "behaviour"
interruptable = "interruptable"
neighbour = "neighbour"
# The camel-case half of a Vanilla method name (SculkSensorBlock.updateNeighbours).
Neighbours = "Neighbours"
# Mojang's own typo in FrostedIceBlock.fewerNeigboursThan.
Neigbours = "Neigbours"
# Mojang's own typo in
# AdvancementVisibilityEvaluator.evaluateVisiblityForUnfinishedNode.
Visiblity = "Visiblity"
# Vanilla stronghold piece-type IDs (shs, shsd, shrc, ...).
shs = "shs"
# Vanilla carver tag name (minecraft:overworld_carver_replaceables).
replaceables = "replaceables"
# Mojang's shipped translation key (snbt.parser.undescore_not_allowed).
undescore = "undescore"
# Vanilla block tag name minecraft:convertable_to_mud
convertable = "convertable"
# Mojang spelling in ThrownTrident.isAcceptibleReturnOwner.
acceptible = "acceptible"
Acceptible = "Acceptible"
# Mojang spelling in Piglin.CHANCE_OF_WEARING_EACH_ARMOUR_ITEM.
ARMOUR = "ARMOUR"
# Vanilla names in TransportItemsBetweenContainers: the TRAVELLING state and its
# onStartTravelling / resumeTravelling steps.
travelling = "travelling"
Travelling = "Travelling"
# Mojang spelling in Avatar.DATA_PLAYER_MODE_CUSTOMISATION, which the generated
# entity data mirrors as `player_mode_customisation`.
customisation = "customisation"
CUSTOMISATION = "CUSTOMISATION"
# French UI strings in `dev/gen-site.py`'s STRINGS table -- real French words
# that happen to collide with English typos ("Contribute"/"construct"/"valid").
Contribuer = "Contribuer"
construit = "construit"
valide = "valide"

[default]
locale = "en-us"
