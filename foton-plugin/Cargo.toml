[package]
name = "foton-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The Bukkit API is implemented in terms of Foton, so this is where
# that translation lives. It sits beside foton-login rather than under
# foton-core: the game does not know plugins exist.
foton-core = { path = "../foton-core" }
uuid.workspace = true
jni = "0.21"
libloading = "0.8"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
