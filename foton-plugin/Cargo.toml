[package]
name = "foton-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The Bukkit API is implemented in terms of Foton, so this is where
# that translation lives. It sits beside foton-login rather than under
# foton-core: the game does not know plugins exist.
foton-core = { path = "../foton-core" }
# Item names cross as registry keys, and this is what resolves them.
foton-protocol.workspace = true
foton-registry.workspace = true
foton-utils.workspace = true
# A sound is played at a point, and the point is a glam vector.
glam.workspace = true
text_components.workspace = true
uuid.workspace = true
jni = "0.21"
# The only thing this crate says out loud: a chunk request released because
# nobody polled it. A plugin author whose request vanished has nothing else
# to go on.
log.workspace = true
libloading = "0.8"
rustc-hash.workspace = true
simdnbt.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
