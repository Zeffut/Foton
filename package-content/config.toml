#:schema https://raw.githubusercontent.com/Zeffut/Foton/refs/heads/master/package-content/config.schema.json
# Documentation: CONFIGURATION.md in the Foton repository

[server]
# Server port
server_port = 25565
# Maximum number of players allowed on the server
max_players = 20
# Allow view_distance above vanilla's 32-chunk cap, up to 128.
allow_extended_view_distance = false
# Maximum view distance in chunks. Normally 1-32; 1-128 when allow_extended_view_distance is true.
view_distance = 10
# Maximum simulation distance in chunks
simulation_distance = 10
# Maximum chained neighbor-update tasks. Negative values disable the limit.
max_chained_neighbor_updates = 1000000
# Whether to use Mojang's authentication service
online_mode = true
# Optional authentication endpoint for online mode. Omit to use Mojang's session server.
# auth_server = "https://sessionserver.mojang.com/session/minecraft/hasJoined"
# Optional name-to-profile lookup endpoint used by commands such as /op.
# profile_server = "https://api.minecraftservices.com/minecraft/profile/lookup/name"
# Optional service public-key endpoint used to validate signed chat certificates.
# services_server = "https://api.minecraftservices.com/publickeys"
# Whether to enable encryption for client-server communication. Required in online mode.
encryption = true
# Whether the server allows unauthorized client flight
allow_flight = false
# Message of the day displayed in server lists
motd = "A Foton Server"

# Whether to use a custom favicon for the server
use_favicon = true
# Path to the favicon file (PNG format, 64x64 pixels)
favicon = "config/favicon.png"
# Whether to enforce secure chat
enforce_secure_chat = false
# Vanilla chat spam threshold window in seconds
chat_spam_threshold_seconds = 10
# Vanilla command spam threshold window in seconds
command_spam_threshold_seconds = 10

# Remote administration over the Source Rcon protocol.
[server.rcon]
# Whether the rcon port is opened at all
enable = false
# Port rcon listens on
port = 25575
# Password every rcon client must send before it may run a command.
# The server refuses to start with rcon enabled and this left blank.
password = ""

# Letting Bedrock Edition players in, through a Geyser this server runs.
[server.bedrock]
# Whether Geyser is started and the Bedrock port opened at all.
enable = false
# UDP port Bedrock clients connect to. 0 means "share server_port" -- one
# port to open, and it keeps following server_port if that ever moves.
# Trade-off: a Bedrock client's "Add Server" dialog pre-fills 19132, so
# sharing the Java port means a player must type the port in by hand. Set
# this to 19132 explicitly for that automatic experience instead.
port = 0
# What Bedrock clients see in the server list; empty reuses the server MOTD.
motd = ""
# Prepended to a Bedrock player's gamertag so it cannot collide with a Java
# player's name. Empty means no prefix, and collisions become possible.
username_prefix = "."
# Addresses a Floodgate identity handshake is accepted from. Foton starts
# Geyser locally, so loopback is the whole list. Widening this means trusting
# whoever can reach the Java port to say who they are.
trusted_proxies = ["127.0.0.1", "::1"]
# A JDK or JRE for Geyser; empty means JAVA_HOME, then java on the path.
java_home = ""
# An operator-supplied Geyser jar; empty means fetch the pinned build.
jar_path = ""

# Where player-filed bug reports are sent, on top of the local
# reports/bugs.jsonl. Leave the URL unset to keep reports local.
[server.bug_reports]
# Endpoint each filed report is posted to; unset keeps reports local.
# The public intake publishes what it receives at foton.zeffut.fr/reports,
# so it is left unset here: a server sends its players' reports somewhere
# public only because its operator decided to, never by default.
# webhook_url = "https://foton.zeffut.fr/api/bug-reports"
# The token the endpoint expects. Without it the post is rejected.
# webhook_token = ""

# Optional worker counts for server thread pools. 0 or omitted uses each pool's automatic default.
[server.threads]
# Worker threads for the primary Tokio runtime.
main_runtime = 0
# Worker threads for the chunk Tokio runtime.
chunk_runtime = 0
# Persistent workers for inter-tick gameplay packet processing.
packet_workers = 0
# Worker threads for the Rayon chunk generation pool.
chunk_generation = 0
# Worker threads for the Rayon chunk encoding pool.
chunk_encoding = 0

# Compression settings
[server.compression]
threshold = 256
level = 4

# Server links configuration
[server.server_links]
# Enable server links feature
enable = true

[[server.server_links.links]]
label = "bug_report"
url = "https://github.com/Zeffut/Foton/issues"

[[server.server_links.links]]
label = "website"
url = "https://github.com/Zeffut/Foton"

# Two more links used to sit here, pointing at a community that is not this
# server's. Re-enable them with your own invite.
# [[server.server_links.links]]
# label = "announcements"
# url = "..."
#
# [[server.server_links.links]]
# label = { text = "Visit the Foton Discord", color = "blue", bold = true }
# url = "..."

# Logging configuration
[log]
# Path where store the log files and history
log_path = "./.logs"
# The level of information the logger will show
log_level = "info"
# Time format: "none", "date" (HH:MM:SS:mmm), or "uptime" (seconds since start)
time = "uptime"
# Whether the module_path of the log should be displayed
module_path = false
# Whether the extra data of the log should be displayed
extra = false
# Whether the log should be written into a file
log_file = true
# Time between log file rotations
rotation_time = "daily"
# Amount of console commands saved
max_history = 50
