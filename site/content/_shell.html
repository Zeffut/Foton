<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="{{ home }}"><img src="/favicon.png" alt="" width="26" height="26"><span>Foton</span></a>
  <nav>{{ nav }}</nav>
  {{ switcher }}
  <span class="chip">{{ chip }}</span>
</header>
{{ body }}
<footer class="bar foot">
  <span>Foton {{ version }} — Minecraft {{ mc_target }}, protocol {{ protocol }}</span>
  <span><a href="https://github.com/Zeffut/Foton">{{ footer_source }}</a> — AGPL-3.0-or-later</span>
  <span class="footer-origin">{{ footer_fork }} <a href="https://github.com/Steel-Foundation/SteelMC">SteelMC</a></span>
</footer>
<script>
  (function () {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    var targets = document.querySelectorAll(".band > .wrap, .hero > div");
    if (reduce.matches || !("IntersectionObserver" in window)) { return; }
    targets.forEach(function (el) { el.classList.add("reveal"); });
    var seen = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) { return; }
        entry.target.classList.add("shown");
        seen.unobserve(entry.target);
      });
    }, { rootMargin: "0px 0px -10% 0px" });
    targets.forEach(function (el) { seen.observe(el); });
  })();
</script>
<script>
  (function () {
    var blocks = document.querySelectorAll(".cmd");
    if (!blocks.length) { return; }

    function detectedOS() {
      var uad = window.navigator.userAgentData;
      var platform = (uad && uad.platform) || window.navigator.platform || "";
      return /Win/.test(platform) ? "win" : "unix";
    }

    function activate(block, os) {
      block.querySelectorAll(".cmd-tab").forEach(function (tab) {
        var active = tab.getAttribute("data-os") === os;
        tab.classList.toggle("is-active", active);
        tab.setAttribute("aria-pressed", active ? "true" : "false");
      });
      block.querySelectorAll(".cmd-line").forEach(function (line) {
        line.classList.toggle("cmd-hidden", line.getAttribute("data-os") !== os);
      });
    }

    function selectText(el) {
      if (!window.getSelection || !document.createRange) { return; }
      var range = document.createRange();
      range.selectNodeContents(el);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function wireCopy(button) {
      var text = button.closest(".cmd-line").querySelector(".cmd-text");
      var labelCopy = button.getAttribute("data-label-copy");
      var labelCopied = button.getAttribute("data-label-copied");
      var labelFailed = button.getAttribute("data-label-failed");
      var timer = null;

      function setLabel(label) {
        button.textContent = label;
        button.setAttribute("aria-label", label);
      }

      function flash(label) {
        if (timer) { clearTimeout(timer); }
        setLabel(label);
        timer = setTimeout(function () {
          timer = null;
          setLabel(labelCopy);
        }, 2000);
      }

      button.addEventListener("click", function () {
        var value = text.textContent;
        if (!navigator.clipboard || !navigator.clipboard.writeText) {
          selectText(text);
          flash(labelFailed);
          return;
        }
        navigator.clipboard.writeText(value).then(function () {
          flash(labelCopied);
        }, function () {
          selectText(text);
          flash(labelFailed);
        });
      });
    }

    blocks.forEach(function (block) {
      activate(block, detectedOS());
      block.querySelectorAll(".cmd-tab").forEach(function (tab) {
        tab.addEventListener("click", function () { activate(block, tab.getAttribute("data-os")); });
      });
      block.querySelectorAll(".cmd-copy").forEach(wireCopy);
    });
  })();
</script>
<!-- Served by Vercel's edge at /_vercel/*, so nothing is bundled here and
     both are inert anywhere else the site is opened. -->
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
