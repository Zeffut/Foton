# https://github.com/bevyengine/bevy/blob/main/.cargo/config_fast_builds.toml for more details

[build]
rustflags = ["-Zthreads=0"]
# TODO: remove once nightly ICE with incremental cache is fixed
#incremental = false

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-fuse-ld=lld", "-Zthreads=0"]

# --no-relax: lld rewrites a GOT load (adrp+ldr) into adrp+add even when
# another path branches straight to the ldr with the adrp skipped, which is
# code GCC emits (llvm/llvm-project#138254). aws-lc's SHA-512 dispatch was
# one such pair: it tested a stray word instead of OPENSSL_armcap_P, and
# 0.16.3 died in sha512su0 on a Pi 4 (#21). dev/check-arm64-got-relax.py
# guards the release binary.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-fuse-ld=lld", "-Clink-arg=-Wl,--no-relax", "-Zthreads=0"]

[alias]
build-native = [
  "build",
  "--config",
  "build.rustflags=[\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.x86_64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=lld\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.aarch64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=lld\",\"-Clink-arg=-Wl,--no-relax\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
]
run-native = [
  "run",
  "--config",
  "build.rustflags=[\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.x86_64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=lld\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.aarch64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=lld\",\"-Clink-arg=-Wl,--no-relax\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
]
