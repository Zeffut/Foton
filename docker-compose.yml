services:
  foton:
    # This compose file builds the current checkout locally. To run the
    # last master commit that passed Test, replace `build: .` with:
    #   image: ghcr.io/zeffut/foton:nightly
    # To keep local source changes, continue using:
    #   docker compose build
    build: .
    stdin_open: true
    tty: true
    container_name: foton-mc
    ports:
      - 25565:25565
    volumes:
      - ./config:/config
      - ./saves:/saves
      - ./logs:/.logs
