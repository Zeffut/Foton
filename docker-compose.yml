services:
  foton:
    # The published image is not built yet -- docker-build.yml has never
    # completed on the ARM runner. Until it does, build locally:
    #   docker compose build
    build: .
    stdin_open: true
    tty: true
    container_name: foton-mc
    ports:
      - 25565:25565
    volumes:
      - ./config:/config
      - ./saves:/saves
      - ./logs:/.logs
